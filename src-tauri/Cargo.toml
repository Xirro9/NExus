[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
# Both upstreams (127.0.0.1 OpenCode, 172.18.0.3 llama) are plain HTTP —
# no TLS stack; add rustls if either ever moves to https (SPEC-PHASE4 §12.5).
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
tokio = { version = "1", features = ["time", "macros"] }
base64 = "0.22"

[dev-dependencies]
# mock app harness for command-level tests (api_fetch / SSE pump against the
# live local service) — test-only, not part of the shipped binary
tauri = { version = "2.12.5", features = ["test"] }
